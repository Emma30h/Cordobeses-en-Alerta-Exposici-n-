<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía · Cordobeses en Alerta</title>
<meta name="theme-color" content="#0a1219">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
/* Guía de bolsillo: misma identidad y movimiento que la presentación, una tarjeta por lámina */
:root{color-scheme:dark;
  --bg:#0a1219;--panel:#101c26;--panel-2:#152330;--line:#22343f;--line-2:#2f4756;--fg:#e8eef2;--muted:#93a6b4;--faint:#5f7484;
  --brand:#42ade8;--brand-soft:rgba(66,173,232,.14);--signal:#e2a23b;--ok:#34c77b;
  --z-n:#3987e5;--z-e:#c98500;--z-co:#008300;--z-s:#d55181;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"Barlow","Segoe UI",Arial,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:620px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(10,18,25,0));padding:14px 0 16px;display:flex;align-items:center;gap:12px}
header img{width:46px;height:auto}
header .t{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase}
header .t span{color:var(--brand)}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 10px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live i{background:var(--ok);box-shadow:0 0 0 0 rgba(52,199,123,.6);animation:pulse 1.8s infinite}
.status.live{color:var(--fg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,123,.6)}100%{box-shadow:0 0 0 10px rgba(52,199,123,0)}}

/* tarjeta y transición entre láminas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.card.anim.fwd{animation:inR .5s var(--ease) both}
.card.anim.bwd{animation:inL .5s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.card.anim [data-a]{animation:rise .6s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.num{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);display:flex;justify-content:space-between;align-items:center}
.num b{color:var(--muted);font-weight:400}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-8px}
.prog i{display:block;height:100%;background:var(--brand);width:var(--p);transition:width .6s var(--ease)}
h1{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.02;margin:0;text-wrap:balance}
h1 .wd{display:inline-block}
.card.anim h1 .wd{animation:word .6s var(--ease) both;animation-delay:calc(var(--w) * 70ms + 120ms)}
@keyframes word{from{opacity:0;transform:translateY(.45em);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figs.one{grid-template-columns:1fr}
.fig{background:var(--panel-2);border-radius:8px;padding:12px;position:relative;overflow:hidden}
.fig::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);transform-origin:top}
.card.anim .fig::after{animation:gy .6s var(--ease) both;animation-delay:calc(var(--d) + .2s)}
@keyframes gy{from{transform:scaleY(0)}to{transform:none}}
.fig .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.fig .k{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.3}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
li{font-size:16.5px;line-height:1.45;padding-left:18px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
li b{font-weight:600}
ol{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:8px}
ol li{padding-left:34px}
ol li::before{counter-increment:p;content:counter(p);width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;top:0;left:0}
.src{font-family:var(--f-mono);font-size:11px;color:var(--faint);line-height:1.5;margin:0}
.cap{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* portada y cierre: radar */
.hero{display:grid;place-items:center;padding:18px 0 6px}
.radar{position:relative;width:150px;height:150px;display:grid;place-items:center}
.radar img{width:96px;position:relative;z-index:1}
.card.anim .radar img{animation:popIn .8s cubic-bezier(.2,.8,.3,1.25) both;animation-delay:.15s}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:ring 3s ease-out infinite}
.radar i:nth-child(2){animation-delay:1s}.radar i:nth-child(3){animation-delay:2s}
@keyframes ring{0%{transform:scale(.45);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

/* organigrama */
.otree{display:flex;flex-direction:column;gap:8px}
.on2{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px}
.on2 .ic{color:var(--brand);margin-top:1px}
.on2 b{display:block;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.on2 small{display:block;font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.on2 em{display:block;font-style:normal;font-size:13.5px;color:var(--fg);opacity:.85;line-height:1.3;margin-top:3px}
.on2.root{border-color:var(--brand);background:linear-gradient(135deg,rgba(66,173,232,.2),rgba(66,173,232,.04))}
.on2.hub{border-color:var(--line-2)}
.on2.sub .ic{color:var(--signal)}
.kids{position:relative;margin-left:16px;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.kids>.on2::before{content:"";position:absolute;left:-21px;top:-9px;width:18px;height:calc(50% + 9px);border-left:2px solid var(--line-2);border-bottom:2px solid var(--line-2);border-bottom-left-radius:7px}
.kids>.on2.more::after{content:"";position:absolute;left:-21px;top:50%;bottom:-9px;border-left:2px solid var(--line-2)}
.card.anim .on2{animation:slideIn .55s var(--ease) both;animation-delay:calc(var(--d) + var(--o) * 140ms)}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.rot{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--signal);border:1px dashed rgba(226,162,59,.5);border-radius:99px;padding:5px 12px}
.rot span{display:inline-block;animation:sway 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.card.anim .rot{animation:slideIn .55s var(--ease) both;animation-delay:calc(var(--d) + var(--o) * 140ms)}

/* personas */
.people{background:var(--panel-2);border-radius:10px;padding:14px}
.pt{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pt .cu{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1;color:var(--brand)}
.pt span:last-child{color:var(--muted);font-size:15px}
.waffle{width:100%;height:auto;display:block}
.waffle .pp{transform-box:fill-box;transform-origin:50% 100%}
.waffle .civ{fill:var(--brand)}.waffle .tec{fill:var(--signal)}.waffle .seg{fill:#e8eef2}
.card.anim .waffle .pp{animation:popP .35s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--d) + var(--k) * 7ms + .3s)}
@keyframes popP{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
.plg{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:14.5px;color:var(--muted)}
.plg span{display:flex;align-items:center;gap:8px}
.plg i{width:11px;height:11px;border-radius:3px;flex:none}
.plg b{color:var(--fg);font-family:var(--f-display);font-size:19px;min-width:30px;font-weight:700}

/* mapa */
.mapw{background:var(--panel-2);border-radius:10px;padding:8px}
.gmap{width:100%;height:auto;display:block}
.gmap .djp{fill:none;stroke:#2a3e4b;stroke-width:1;vector-effect:non-scaling-stroke}
.gmap .b{stroke:rgba(10,18,25,.85);stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:opacity .3s;transform-box:fill-box;transform-origin:center}
.gmap .z-n{fill:var(--z-n)}.gmap .z-e{fill:var(--z-e)}.gmap .z-co{fill:var(--z-co)}.gmap .z-s{fill:var(--z-s)}
.gmap .cq{fill:none;stroke:#e8eef2;stroke-width:1.6;stroke-opacity:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.gmap .cl{font-family:var(--f-display);font-size:54px;font-weight:700;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:8px;text-anchor:middle}
.gmap.filter .b{opacity:.13}.gmap.filter .b.sel{opacity:1}
.card.anim .gmap .b{animation:popB .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i) * 4ms + .45s)}
@keyframes popB{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.card.anim .gmap .cq{stroke-dasharray:var(--len);animation:draw 1.5s ease both;animation-delay:1.4s}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.card.anim .gmap .labels{animation:fadeIn .6s both;animation-delay:2.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.zb{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
.zb[aria-pressed="true"]{border-color:var(--fg);background:#1a2c3a}
.zb:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.zb .zn{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
.zb .zn i{width:10px;height:10px;border-radius:3px}
.zb .zv{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.zb .zv small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted);margin-left:4px}
.zb .zc{font-size:12.5px;color:var(--muted);line-height:1.25}
.hint{font-size:12.5px;color:var(--faint);text-align:center;margin-top:8px}

/* pasos */
.steps{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:44px}
.steps::before,.steps .pl{content:"";position:absolute;left:14px;top:14px;bottom:14px;width:2px;background:var(--line)}
.steps .pl{background:var(--brand);transform-origin:top}
.card.anim .steps .pl{animation:gy var(--T) linear both;animation-delay:calc(var(--d) + .3s)}
.stp{position:relative}
.stp .dot{position:absolute;left:-44px;top:-1px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#04121c;border:2px solid var(--brand);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700}
.stp .dot .ic{width:16px;height:16px}
.stp small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.stp p{margin:2px 0 0;font-size:16px;line-height:1.38}
.card.anim .stp{animation:rise .5s var(--ease) both;animation-delay:calc(var(--d) + .3s + var(--k) * var(--S))}
.card.anim .stp .dot{animation:lit .45s both;animation-delay:calc(var(--d) + .3s + var(--k) * var(--S))}
@keyframes lit{0%{background:var(--panel-2);border-color:var(--line);color:var(--muted);transform:scale(.7)}60%{transform:scale(1.15)}100%{background:var(--brand);border-color:var(--brand);color:#04121c;transform:none}}
.callout{border-left:3px solid var(--signal);background:rgba(226,162,59,.08);border-radius:0 8px 8px 0;padding:11px 13px;font-size:15.5px;line-height:1.4}
.callout b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);font-weight:400;margin-bottom:3px}

/* tarjetas con ícono */
.tiles{display:grid;grid-template-columns:1fr;gap:8px}
.tile{display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border-radius:9px;padding:12px}
.tile .ib{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tile b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.1}
.tile p{margin:3px 0 0;font-size:14.5px;color:var(--muted);line-height:1.38}
.card.anim .tile .ib{animation:popIn .5s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--d) + .15s)}

/* anillo */
.ringw{display:flex;align-items:center;gap:14px;background:var(--panel-2);border-radius:9px;padding:12px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--line)}
.ring .vl{stroke:var(--c,var(--brand));stroke-linecap:round;stroke-dasharray:var(--C);stroke-dashoffset:calc(var(--C) * (1 - var(--p)))}
.card.anim .ring .vl{animation:ringF 1.3s var(--ease) both;animation-delay:calc(var(--d) + .25s)}
@keyframes ringF{from{stroke-dashoffset:var(--C)}}
.ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;text-align:center}
.ring span small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.ringw p{margin:0;font-size:15px;line-height:1.4}
.ringw p b{display:block;font-family:var(--f-display);font-size:19px}

/* barras */
.chart{background:var(--panel-2);border-radius:10px;padding:14px 12px 10px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:24px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.vb{width:100%;border-radius:3px 3px 0 0;background:#2c4a5e;transform-origin:bottom}
.vb.hi{background:var(--brand)}
.vb.b25{background:#3b5568}
.card.anim .vb{animation:gyb .8s var(--ease) both;animation-delay:calc(var(--d) + .3s + var(--i) * 45ms)}
@keyframes gyb{from{transform:scaleY(0)}to{transform:none}}
.bar .lab{position:absolute;bottom:calc(var(--h) + 4px);font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg);white-space:nowrap}
.card.anim .bar .lab{animation:fadeIn .5s both;animation-delay:calc(var(--d) + 1.1s)}
.bx{display:flex;gap:3px;margin-top:6px}
.bx span{flex:1;text-align:center;font-family:var(--f-mono);font-size:10px;color:var(--faint);min-width:0;overflow:visible;white-space:nowrap}
.pair{flex:1;height:100%;display:flex;align-items:flex-end;gap:2px}
.pair .vb{flex:1}
.lgd{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.lgd span{display:flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}

/* barra dividida */
.split{display:flex;height:34px;border-radius:7px;overflow:hidden;margin:8px 0}
.split div{display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#04121c;transform-origin:left}
.card.anim .split div{animation:gx .9s var(--ease) both;animation-delay:calc(var(--d) + .3s)}
@keyframes gx{from{transform:scaleX(0)}to{transform:none}}

/* turnos */
.shift{position:relative;display:flex;height:44px;border-radius:8px;overflow:hidden;gap:2px}
.shift div{flex:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;color:#04121c;transform-origin:left}
.card.anim .shift div{animation:gx .6s var(--ease) both;animation-delay:calc(var(--d) + .3s + var(--i) * 220ms)}
.sx{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.cyc{display:flex;gap:4px;margin-top:12px;align-items:center;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.cyc i{width:22px;height:22px;border-radius:5px;background:var(--brand)}
.cyc i.off{background:var(--line)}
.card.anim .cyc i{animation:popIn .35s both;animation-delay:calc(var(--d) + 1.1s + var(--i) * 90ms)}

/* tubería del dato */
.pipe{display:flex;flex-direction:column;gap:0}
.pipe .tile{position:relative}
.arr{height:22px;display:grid;place-items:center;color:var(--brand)}
.arr svg{width:16px;height:16px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:99px;padding:6px 12px;font-size:14px}
.chip b{color:var(--brand)}

.back{display:none;margin:12px 0 0;width:100%;background:var(--brand);color:#04121c;border:0;border-radius:10px;padding:13px;font:600 16px var(--f-body)}
.back.show{display:block}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,18,25,.94);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:center}
nav.bar button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;height:46px;min-width:64px;font:600 20px var(--f-body)}
nav.bar button:focus-visible,.idx button:focus-visible,.back:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
nav.bar .pos{min-width:70px;text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
summary{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:6px 0}
.idx{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.idx button{all:unset;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 8px;border-radius:8px;font-size:15px;color:var(--muted);cursor:pointer}
.idx button span{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:2px}
.idx button.cur{background:var(--panel);color:var(--fg)}
.idx button.cur span{color:var(--brand)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--brand);color:#04121c;font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .3s,transform .3s;z-index:7;pointer-events:none;white-space:nowrap}

function people(parts,cols){
  const person='M6 2.2a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4Z M2.2 13.6c0-3.1 1.7-5.3 3.8-5.3s3.8 2.2 3.8 5.3Z';
  const n=parts.reduce((a,p)=>a+p[1],0), rows=Math.ceil(n/cols), cw=18, ch=20; let k=0, g='';
  parts.forEach(([c,m])=>{for(let j=0;j<m;j++){const x=(k%cols)*cw+2, y=Math.floor(k/cols)*ch+1;
    g+=`<g transform="translate(${x},${y}) scale(1.35)"><path class="pp ${c}" style="--k:${k}" d="${person}"/></g>`;k++}});
  return `<svg class="waffle" viewBox="0 0 ${cols*cw} ${rows*ch}" role="img" aria-label="${n} personas">${g}</svg>`;
}
function bars(vals,labels,hi,lab){
  const mx=Math.max(...vals);
  const b=vals.map((v,i)=>{const h=(v/mx*100).toFixed(1)+'%';return `<div class="bar" style="--h:${h}"><div class="vb${hi(i)?' hi':''}" style="height:${h};--i:${i}"></div>${lab&&lab[i]!=null?`<span class="lab">${lab[i]}</span>`:''}</div>`}).join('');
  return `<div class="bars">${b}</div><div class="bx">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`;
}
function ring(p,txt,c){const r=40,C=(2*Math.PI*r).toFixed(1);return `<div class="ring" style="--C:${C};--p:${p};${c?'--c:'+c:''}"><svg viewBox="0 0 92 92"><circle class="tr" cx="46" cy="46" r="${r}"/><circle class="vl" cx="46" cy="46" r="${r}"/></svg><span>${txt}</span></div>`}
const tile=(ic,t,p)=>`<div class="tile" data-a><div class="ib">${I(ic)}</div><div><b>${t}</b>${p?`<p>${p}</p>`:''}</div></div>`;
const node=(o,ic,t,w,d,cls='')=>`<div class="on2 ${cls}" style="--o:${o}">${I(ic)}<div><b>${t}</b>${w?`<small>${w}</small>`:''}${d?`<em>${d}</em>`:''}</div></div>`;
function steps(list,S){return `<div class="steps" data-a style="--S:${S}s;--T:${(list.length-1)*S}s"><span class="pl"></span>${list.map(([ic,a,t],k)=>`<div class="stp" style="--k:${k}"><span class="dot">${I(ic)}</span><small>${a}</small><p>${t}</p></div>`).join('')}</div>`}

   ${tile('check','Auditoría de hechos','Cada carta cerrada se revisa, se define si fue un hecho relevante (positivo) y se tipifica.')}`,

   <div class="chips" data-a><span class="chip"><b>SAE WEB</b> · sistema del programa</span><span class="chip"><b>SAE 911</b> · sistema policial</span></div>`,
 anio:()=>{const pd=AL.map((v,i)=>Math.round(v/DM[i]));return `<div class="chart" data-a><p class="cap">Alertas por día · promedio de cada mes</p>${bars(pd,MES,i=>i>=10,pd.map((v,i)=>i===0||i===11?v:null))}</div>`},
 respuesta:()=>`<div class="chart" data-a><p class="cap">Alertas según la hora del día · 12 meses</p>${bars(HORA,HORA.map((_,h)=>h%6===0?h+' h':''),h=>h>=18,HORA.map((_,h)=>h===21?'21 h':null))}<div class="lgd"><span><i style="background:var(--brand)"></i>de 18 a 0 h: el 37% de las alertas</span></div></div>`,
 resultados:()=>`<div class="chart" data-a><p class="cap">Hechos prevenibles por mes · barrios del programa</p>
   <div class="bars">${PV25.map((a,i)=>{const mx=1937,b=PV26[i];return `<div class="pair"><div class="vb b25" style="height:${(a/mx*100).toFixed(1)}%;--i:${i*2}"></div><div class="vb hi" style="height:${(b/mx*100).toFixed(1)}%;--i:${i*2+1}"></div></div>`}).join('')}</div>
   <div class="bx">${['E','F','M','A','M','J','J','A','S'].map(m=>`<span>${m}</span>`).join('')}</div>
   <div class="lgd"><span><i style="background:#3b5568"></i>2025 · <span class="cu">15.381</span></span><span><i style="background:var(--brand)"></i>2026 · <span class="cu">12.789</span></span></div></div>

   <div class="cyc">${[1,1,0,0,1,1,0,0].map((w,i)=>`<i class="${w?'':'off'}" style="--i:${i}"></i>`).join('')}<span style="margin-left:6px">2 días de trabajo, 2 de descanso</span></div></div>`

const N=L.length, main=document.getElementById('main'), idx=document.getElementById('idx');
let cur=0, live=null, follow=true, dir=1;
L.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${x.t}`;b.onclick=()=>{go(i,true);document.querySelector('details').open=false;scrollTo({top:0,behavior:'smooth'})};idx.appendChild(b)});

/* números que cuentan: "188.300", "−16,9%", "2 min"… quedan exactos al final */
function countUp(el,delay){
  const txt=el.textContent, m=txt.match(/^([^\d]*)(\d[\d.]*(?:,\d+)?)(.*)$/);
  if(!m||/^\s*(\/|de\s)/.test(m[3])) return;
  const raw=m[2], dec=(raw.split(',')[1]||'').length, val=parseFloat(raw.replace(/\./g,'').replace(',','.'));
  const fmt=v=>{let s=v.toFixed(dec).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return s.join(',')};
  el.textContent=m[1]+fmt(0)+m[3]; const dur=1100; let t0=null;
  setTimeout(()=>requestAnimationFrame(function f(t){t0??=t;const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=m[1]+fmt(val*e)+m[3];if(p<1)requestAnimationFrame(f);else el.textContent=txt}),delay);
}
function words(t){let w=0;return t.split(' ').map(s=>`<span class="wd" style="--w:${w++}">${s}</span>`).join(' ')}

function render(anim){
  const x=L[cur], v=VIS[x.id];
  let h=`<article class="card${anim?' anim '+(dir<0?'bwd':'fwd'):''}"><div class="num">Lámina ${cur+1}<b>de ${N}</b></div><div class="prog"><i style="--p:${((cur+1)/N*100).toFixed(1)}%"></i></div><h1 aria-label="${x.t}">${words(x.t)}</h1>`;
  if(x.f) h+=`<div class="figs${x.f.length===1?' one':''}">${x.f.map(([v,k])=>`<div class="fig" data-a><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>`;
  if(v) h+=v();
  if(x.o) h+=`<ol>${x.o.map(s=>`<li data-a>${s}</li>`).join('')}</ol>`;
  if(x.b) h+=`<ul>${x.b.map(s=>`<li data-a>${s}</li>`).join('')}</ul>`;
  if(x.s) h+=`<p class="src" data-a>${x.s}</p>`;
  main.innerHTML=h+'</article>';
  const card=main.firstChild, base=.32+x.t.split(' ').length*.05;
  card.querySelectorAll('[data-a]').forEach((e,i)=>e.style.setProperty('--d',(base+i*.1).toFixed(2)+'s'));
  const map=card.querySelector('.gmap');
  if(map){
    map.querySelectorAll('.cq').forEach(p=>{try{p.style.setProperty('--len',Math.ceil(p.getTotalLength()))}catch(e){}});
    card.querySelectorAll('.zb').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';
      card.querySelectorAll('.zb').forEach(o=>o.setAttribute('aria-pressed','false'));
      map.classList.toggle('filter',on); map.querySelectorAll('.b').forEach(p=>p.classList.toggle('sel',on&&p.classList.contains('z-'+b.dataset.z)));
      if(on)b.setAttribute('aria-pressed','true')});
  }
  if(anim && !matchMedia('(prefers-reduced-motion:reduce)').matches)
    card.querySelectorAll('.fig .v, .cu').forEach(e=>{const a=e.closest('[data-a]');countUp(e,a?parseFloat(a.style.getPropertyValue('--d'))*1000+150:300)});
  ui();
}
function ui(){
  document.getElementById('pos').textContent=`${cur+1} / ${N}`;
  [...idx.children].forEach((b,i)=>b.classList.toggle('cur',i===cur));
  document.getElementById('back').classList.toggle('show', live!==null && !follow && live!==cur);
  try{localStorage.setItem('guiaCur',cur)}catch(e){}
}
function go(i,manual){ i=Math.max(0,Math.min(N-1,i)); if(manual && live!==null && i!==live) follow=false; if(manual && i===live) follow=true; const ch=i!==cur; dir=i<cur?-1:1; cur=i; if(ch){render(true);scrollTo({top:0,behavior:'smooth'})} else ui(); }
document.getElementById('prev').onclick=()=>go(cur-1,true);
document.getElementById('next').onclick=()=>go(cur+1,true);
document.getElementById('back').onclick=()=>{follow=true;go(live,false)};
let sx=0,sy=0; addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1),true)},{passive:true});
try{const s=+localStorage.getItem('guiaCur');if(s>=0&&s<N)cur=s}catch(e){}
render(true);

/* ---- en vivo ---- */
const st=document.getElementById('status'), stx=document.getElementById('statusTxt'), toast=document.getElementById('toast');
function setStatus(on,txt){st.classList.toggle('live',on);stx.textContent=txt}
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
let lastT=0, lastMsg=0;
(async()=>{
  const C=window.VIVO;
  if(!C||!window.supabase||!C.SUPABASE_URL.startsWith('http')){setStatus(false,'Modo manual');return}
  let key; try{key=await crypto.subtle.importKey('jwk',C.CLAVE_PUBLICA,{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}catch(e){setStatus(false,'Modo manual');return}
  const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{realtime:{params:{eventsPerSecond:5}}});
  const ch=sb.channel(C.CANAL,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'lamina'},async({payload})=>{
    try{
      const {s,id,v,t,sig}=payload||{}; if(!Number.isInteger(s)||typeof id!=='string'||typeof v!=='string'||typeof t!=='number'||t<=lastT||typeof sig!=='string')return;
      const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u(sig),new TextEncoder().encode(s+'|'+id+'|'+v+'|'+t));
      if(!ok)return;
      // versión distinta: recargar una vez con la guía nueva
      if(v!==VER){ let n=0; try{n=+sessionStorage.getItem('guiaRecarga')||0}catch(e){} if(n<2){ try{sessionStorage.setItem('guiaRecarga',n+1)}catch(e){} location.replace(location.pathname+'?v='+encodeURIComponent(v)); return; } }
      let i=L.findIndex(x=>x.id===id); if(i<0) i=s-1; if(i<0||i>=N) return;
      lastT=t; lastMsg=Date.now(); const changed=live!==i; live=i;
      setStatus(true,'En vivo');
      if(follow && i!==cur){ go(i,false); toast.textContent='Lámina '+(i+1); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); try{navigator.vibrate&&navigator.vibrate(30)}catch(e){} }
      else if(changed) ui();
    }catch(e){}
  }).subscribe(state=>{ if(state==='SUBSCRIBED') setStatus(false,'Esperando al expositor'); else if(state!=='JOINING') setStatus(false,'Modo manual'); });
  setInterval(()=>{ if(lastMsg && Date.now()-lastMsg>15000) setStatus(false,'Sin señal · manual') },5000);
})();
</script>
