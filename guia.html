<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía · Cordobeses en Alerta</title>
<meta name="theme-color" content="#0a1219">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url('fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url('fonts/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
/* Guía de bolsillo: misma identidad que la presentación, una tarjeta por lámina */
:root{color-scheme:dark;
  --bg:#0a1219;--panel:#101c26;--panel-2:#152330;--line:#22343f;--fg:#e8eef2;--muted:#93a6b4;--faint:#5f7484;
  --brand:#42ade8;--brand-soft:rgba(66,173,232,.14);--signal:#e2a23b;--ok:#34c77b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"Barlow","Segoe UI",Arial,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:620px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(10,18,25,0));padding:14px 0 16px;display:flex;align-items:center;gap:12px}
header img{width:46px;height:auto}
header .t{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase}
header .t span{color:var(--brand)}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 10px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live i{background:var(--ok);box-shadow:0 0 0 0 rgba(52,199,123,.6);animation:pulse 1.8s infinite}
.status.live{color:var(--fg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,123,.6)}100%{box-shadow:0 0 0 10px rgba(52,199,123,0)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px}
.card.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.num{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);display:flex;justify-content:space-between}
.num b{color:var(--muted);font-weight:400}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.02;margin:0;text-wrap:balance}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fig{background:var(--panel-2);border-radius:8px;padding:12px}
.fig .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.fig .k{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.3}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
li{font-size:16.5px;line-height:1.45;padding-left:18px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
li b{font-weight:600}
ol{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:8px}
ol li{padding-left:34px}
ol li::before{counter-increment:p;content:counter(p);width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;top:0;left:0}
.src{font-family:var(--f-mono);font-size:11px;color:var(--faint);line-height:1.5}
.back{display:none;margin:12px 0 0;width:100%;background:var(--brand);color:#04121c;border:0;border-radius:10px;padding:13px;font:600 16px var(--f-body)}
.back.show{display:block}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,18,25,.94);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:center}
nav.bar button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;height:46px;min-width:64px;font:600 20px var(--f-body)}
nav.bar button:focus-visible,.idx button:focus-visible,.back:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
nav.bar .pos{min-width:70px;text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
summary{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:6px 0}
.idx{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.idx button{all:unset;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 8px;border-radius:8px;font-size:15px;color:var(--muted);cursor:pointer}
.idx button span{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:2px}
.idx button.cur{background:var(--panel);color:var(--fg)}
.idx button.cur span{color:var(--brand)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--brand);color:#04121c;font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .3s,transform .3s;z-index:7;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img src="media/logo_ojo.png" alt="">
  <div class="t">Cordobeses<br><span>en Alerta</span></div>
  <div class="status" id="status"><i></i><span id="statusTxt">Conectando…</span></div>
</header>

<main id="main" aria-live="polite"></main>
<button class="back" id="back">Volver a la lámina en pantalla</button>

<details>
  <summary>Todas las láminas</summary>
  <div class="idx" id="idx"></div>
</details>

<nav class="bar">
  <button id="prev" aria-label="Lámina anterior">←</button>
  <span class="pos" id="pos">1 / 14</span>
  <button id="next" aria-label="Lámina siguiente">→</button>
</nav>
<div class="toast" id="toast">Lámina siguiente</div>

<script src="config-vivo.js"></script>
<script src="vendor/supabase.js"></script>
<script>
const L=[
 {t:'Dirección Monitoreo Cordobeses en Alerta',b:['Cómo trabajamos: del mensaje del vecino al móvil en la calle.','Policía de la Provincia de Córdoba · Ministerio de Seguridad.','Esta guía acompaña la exposición: cambia sola cuando el expositor pasa de lámina.']},
 {t:'El programa en cifras',f:[['188.300','vecinos adheridos (oct. 2026)'],['234','barrios de Córdoba Capital'],['8','cuadrantes de atención'],['24/7','los 365 días']],b:['<b>División Alerta</b>: el vecino escribe por WhatsApp a su cuadrante con texto, audio, foto, video o ubicación.','<b>Coordinación Vecinal</b>: 1.123 grupos de WhatsApp llegan a los barrios donde el programa todavía no está.']},
 {t:'Quiénes somos',b:['La Dirección tiene tres áreas: <b>Ayudantía y Análisis Estadístico</b>, <b>Socioeducativo</b> y el <b>Departamento Alerta Ciudadana</b>.','Alerta Ciudadana reúne dos divisiones paralelas, Alerta y Coordinación Vecinal, con personal que rota entre ambas.','Modelo mixto: personal civil y policial comparten el mismo puesto de trabajo.']},
 {t:'El territorio',f:[['4','zonas de radio'],['8','cuadrantes'],['21','unidades territoriales (DJP)'],['234','barrios']],b:['<b>Norte</b>: Urca · <b>Este</b>: Alta Córdoba, Yofre y Pueyrredón · <b>Centro-Oeste</b>: Quebrada y Caseros · <b>Sur</b>: San Vicente e Inaudi.','El 22 de julio de 2026 se sumaron 90 barrios: de 144 a 234.'],s:'Barrios: listado interno · Vecinos: dato interno, octubre 2026'},
 {t:'El recorrido de una alerta',o:['El vecino envía la alerta por WhatsApp.','El operador de cabina de ese cuadrante abre la carta en el SAE WEB.','El radio operador de la zona despacha el móvil.','El móvil informa por radio y todo se registra en la carta.','El coordinador evalúa si el hecho es relevante y eleva el parte.','El operador le cuenta al vecino cómo terminó.','Se cierra la carta y Auditoría la revisa.'],b:['<b>Corresponsabilidad</b>: la seguridad se construye entre la comunidad y la Policía.']},
 {t:'La sala por dentro',b:['<b>Operadores de cabina</b>: cada uno atiende un cuadrante; reciben el WhatsApp y cierran con el vecino.','<b>Videovigilancia</b>: un operador de otra dirección aporta imagen del hecho.','<b>Coordinadores de zona</b> (Norte y Sur): evalúan cada hecho y elevan el parte.','<b>Radio operadores</b>: uno por zona y uno de SAE 911, nexo con los distritos policiales.']},
 {t:'Control y calidad',b:['<b>Auditoría de móviles</b>: si un móvil queda detenido más de 15 minutos en un lugar, salta una alarma automática. El recorrido queda registrado.','<b>Auditoría de hechos</b>: cada carta cerrada se revisa, se define si fue un hecho relevante (positivo) y se tipifica.']},
 {t:'Donde no llega el programa',f:[['1.123','grupos de WhatsApp de Base de Coordinación'],['193','alertas de fuera de cuadrante en una semana (8%)']],b:['Coordinación Vecinal es anterior al programa y sigue funcionando en paralelo.','Si una alerta llega de fuera de los cuadrantes, se deriva al distrito policial y la respuesta vuelve a la misma carta.'],s:'Fuera de cuadrante: semana del 2 al 8 de octubre de 2026'},
 {t:'Del dato a la decisión',o:['Registro: carta en el SAE WEB.','Control: Auditoría valida y tipifica.','Análisis: Ayudantía y Análisis Estadístico cruza los datos.','Decisión: informes semanales, mensuales y a pedido.'],b:['<b>SAE WEB</b> es el sistema del programa; <b>SAE 911</b>, el de la institución policial.']},
 {t:'Un año de trabajo',f:[['74.327','alertas recibidas'],['2.860','positivos (3,8%)'],['1.687','personas aprehendidas'],['810','vehículos secuestrados']],b:['La demanda pasó de <b>144 a 328 alertas por día</b> (octubre 2025 → septiembre 2026).','Septiembre de 2026 fue el mes con más alertas y más positivos.'],s:'Fuente: base del SAE · octubre 2025 a septiembre 2026'},
 {t:'Tiempo de respuesta',f:[['2 min','hasta despachar el móvil (mediana)'],['8 min','hasta que el móvil llega (mediana)']],b:['El 77% se despacha en 3 minutos o menos; el 86% llega en 15 minutos o menos.','Las alertas crecen desde la tarde: pico a las 21 h. Sábado y domingo son los días más cargados.'],s:'Fuente: base del SAE · llegada medida sobre 26.001 hechos con hora de arribo'},
 {t:'Resultados',f:[['−16,9%','hechos prevenibles, ene–sep 2026 vs 2025'],['4 de 5','emergencias de salud del programa no figuran en el 911']],b:['Hechos prevenibles: de 15.381 a 12.789 en los barrios del programa, con baja en los 9 meses.','La baja acompaña la presencia del programa; no aísla su efecto de otras medidas.'],s:'Fuentes: SEDEPO Lite · SAE y 911'},
 {t:'El equipo',f:[['188','personas en la Dirección'],['73%','personal civil']],b:['Seis turnos rotativos: A·B de 7 a 15 h, C·D de 15 a 23 h, E·F de 23 a 7 h. Cada turno trabaja 2 días y descansa 2.','<b>Socioeducativo</b> capacita al personal y a la comunidad.'],s:'Fuente: nómina al 9 de octubre de 2026'},
 {t:'Muchas gracias',f:[['188.300','vecinos conectados'],['234','barrios']],b:['Dirección Monitoreo Cordobeses en Alerta · atención las 24 horas, todo el año.']}
];
const N=L.length, main=document.getElementById('main'), idx=document.getElementById('idx');
let cur=0, live=null, follow=true;
L.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${x.t}`;b.onclick=()=>{go(i,true);document.querySelector('details').open=false;scrollTo({top:0,behavior:'smooth'})};idx.appendChild(b)});
function render(anim){
  const x=L[cur]; let h=`<article class="card${anim?' enter':''}"><div class="num">Lámina ${cur+1}<b>de ${N}</b></div><h1>${x.t}</h1>`;
  if(x.f) h+=`<div class="figs">${x.f.map(([v,k])=>`<div class="fig"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>`;
  if(x.o) h+=`<ol>${x.o.map(s=>`<li>${s}</li>`).join('')}</ol>`;
  if(x.b) h+=`<ul>${x.b.map(s=>`<li>${s}</li>`).join('')}</ul>`;
  if(x.s) h+=`<p class="src">${x.s}</p>`;
  main.innerHTML=h+'</article>';
  document.getElementById('pos').textContent=`${cur+1} / ${N}`;
  [...idx.children].forEach((b,i)=>b.classList.toggle('cur',i===cur));
  document.getElementById('back').classList.toggle('show', live!==null && !follow && live!==cur);
  try{localStorage.setItem('guiaCur',cur)}catch(e){}
}
function go(i,manual){ i=Math.max(0,Math.min(N-1,i)); if(manual && live!==null && i!==live) follow=false; if(manual && i===live) follow=true; const ch=i!==cur; cur=i; render(ch); }
document.getElementById('prev').onclick=()=>go(cur-1,true);
document.getElementById('next').onclick=()=>go(cur+1,true);
document.getElementById('back').onclick=()=>{follow=true;go(live,false)};
let sx=0,sy=0; addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1),true)},{passive:true});
try{const s=+localStorage.getItem('guiaCur');if(s>=0&&s<N)cur=s}catch(e){}
render(false);

/* ---- en vivo ---- */
const st=document.getElementById('status'), stx=document.getElementById('statusTxt'), toast=document.getElementById('toast');
function setStatus(on,txt){st.classList.toggle('live',on);stx.textContent=txt}
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
let lastT=0, lastMsg=0;
(async()=>{
  const C=window.VIVO;
  if(!C||!window.supabase||!C.SUPABASE_URL.startsWith('http')){setStatus(false,'Modo manual');return}
  let key; try{key=await crypto.subtle.importKey('jwk',C.CLAVE_PUBLICA,{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}catch(e){setStatus(false,'Modo manual');return}
  const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{realtime:{params:{eventsPerSecond:5}}});
  const ch=sb.channel(C.CANAL,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'lamina'},async({payload})=>{
    try{
      const {s,t,sig}=payload||{}; if(!Number.isInteger(s)||s<1||s>N||typeof t!=='number'||t<=lastT||typeof sig!=='string')return;
      const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u(sig),new TextEncoder().encode(s+'|'+t));
      if(!ok)return;
      lastT=t; lastMsg=Date.now(); const i=s-1; const changed=live!==i; live=i;
      setStatus(true,'En vivo');
      if(follow && i!==cur){ go(i,false); toast.textContent='Lámina '+(i+1); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); try{navigator.vibrate&&navigator.vibrate(30)}catch(e){} }
      else if(changed) render(false);
    }catch(e){}
  }).subscribe(state=>{ if(state==='SUBSCRIBED') setStatus(false,'Esperando al expositor'); else if(state!=='JOINING') setStatus(false,'Modo manual'); });
  setInterval(()=>{ if(lastMsg && Date.now()-lastMsg>15000) setStatus(false,'Sin señal · manual') },5000);
})();
</script>
</body>
</html>
